<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCPM-o 4.5 · 独立 Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: #12121c; color: #eee; min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .hint { opacity: .6; font-size: 13px; line-height: 1.7; }
    .card {
      margin-top: 18px; padding: 16px; border-radius: 14px;
      background: #1b1b2a; border: 1px solid #2c2c40;
    }
    button {
      background: #5b5bd6; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 16px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: #2a2a3d; }
    button.hold { background: #c45c7a; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    video, canvas { width: 240px; border-radius: 10px; background: #000; }
    #log {
      white-space: pre-wrap; line-height: 1.7; min-height: 4em; font-size: 15px;
    }
    #status { font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
<main>
  <h1>MiniCPM-o 4.5 · 听 + 说</h1>
  <p class="hint">
    这是和 xiaoke 主程序分开的小 Demo：音频直接进模型，不再先 ASR 再 LLM。
    按住说话，松开发给模型。当前不加载视觉（省显存）。
  </p>
  <div class="card">
    <div id="status">查询状态…</div>
    <div class="row">
      <button id="btnWarm" type="button">加载模型</button>
    </div>
    <div class="row">
      <button id="btnTalk" type="button">按住说话</button>
      <span class="hint" id="recHint">还没开始</span>
    </div>
    <p id="log"></p>
  </div>
</main>
<script>
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const recHint = document.getElementById("recHint");
let recStream = null;
let recChunks = [];
let recProc = null;
let recCtx = null;
let holding = false;

async function refreshStatus() {
  const r = await fetch("/api/status").then(x => x.json());
  statusEl.textContent =
    `后端 ${r.backend || "未加载"} · ${r.message || ""} · ${r.cuda || ""}` +
    (r.gguf_ok ? " · GGUF 已下载" : " · GGUF 未下载") +
    (r.server ? " · 已找到 llama-omni-server" : "");
  return r;
}

document.getElementById("btnWarm").onclick = async () => {
  document.getElementById("btnWarm").disabled = true;
  statusEl.textContent = "正在加载，第一次可能要几分钟…";
  const r = await fetch("/api/warmup?prefer=auto", { method: "POST" }).then(x => x.json());
  document.getElementById("btnWarm").disabled = false;
  if (!r.ok) statusEl.textContent = "失败：" + (r.message || "");
  else await refreshStatus();
};

function f32ToB64(f32) {
  const bytes = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
  const chunk = 0x8000;
  let bin = "";
  for (let i = 0; i < bytes.length; i += chunk) {
    const piece = bytes.subarray(i, Math.min(i + chunk, bytes.length));
    bin += String.fromCharCode.apply(null, piece);
  }
  return btoa(bin);
}

function mergeFloat32(chunks) {
  let n = 0;
  for (const c of chunks) n += c.length;
  const out = new Float32Array(n);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

async function resampleTo16k(float32, fromRate) {
  if (fromRate === 16000) return float32;
  const len = Math.round(float32.length * 16000 / fromRate);
  const ctx = new OfflineAudioContext(1, len, 16000);
  const buf = ctx.createBuffer(1, float32.length, fromRate);
  buf.copyToChannel(float32, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start();
  const rendered = await ctx.startRendering();
  return rendered.getChannelData(0).slice();
}

const talk = document.getElementById("btnTalk");
talk.onmousedown = talk.ontouchstart = async (e) => {
  e.preventDefault();
  if (holding) return;
  holding = true;
  talk.classList.add("hold");
  recHint.textContent = "在听…";
  recChunks = [];
  recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recCtx = new AudioContext();
  const src = recCtx.createMediaStreamSource(recStream);
  recProc = recCtx.createScriptProcessor(4096, 1, 1);
  recProc.onaudioprocess = (ev) => {
    if (holding) recChunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
  };
  src.connect(recProc);
  recProc.connect(recCtx.destination);
};
async function stopTalk() {
  if (!holding) return;
  holding = false;
  talk.classList.remove("hold");
  recHint.textContent = "在想…";
  try { recProc && recProc.disconnect(); } catch {}
  recStream && recStream.getTracks().forEach(t => t.stop());
  const rate = recCtx ? recCtx.sampleRate : 48000;
  try { await recCtx?.close(); } catch {}
  const merged = mergeFloat32(recChunks);
  const pcm16k = await resampleTo16k(merged, rate);
  const b64 = f32ToB64(pcm16k);
  const fd = new FormData();
  fd.append("pcm_b64", b64);
  logEl.textContent = "";
  let horizon = 0;
  let actx = null;
  const resp = await fetch("/api/turn", { method: "POST", body: fd });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const line = chunk.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      const ev = JSON.parse(line.slice(5).trim());
      if (ev.type === "text") logEl.textContent += ev.delta || "";
      if (ev.type === "error") { recHint.textContent = ev.message; logEl.textContent += "\n" + ev.message; }
      if (ev.type === "audio" && ev.pcm_b64) {
        const raw = atob(ev.pcm_b64);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        const i16 = new Int16Array(bytes.buffer);
        const f32 = new Float32Array(i16.length);
        for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
        const sr = ev.rate || 24000;
        if (!actx) actx = new AudioContext({ sampleRate: sr });
        const bufN = actx.createBuffer(1, f32.length, sr);
        bufN.copyToChannel(f32, 0);
        const srcN = actx.createBufferSource();
        srcN.buffer = bufN;
        srcN.connect(actx.destination);
        const now = actx.currentTime;
        const t = horizon > now + 0.02 ? horizon : now + 0.02;
        horizon = t + bufN.duration;
        srcN.start(t);
      }
      if (ev.type === "done") recHint.textContent = "说完了 · " + (ev.backend || "");
    }
  }
}
talk.onmouseup = talk.ontouchend = (e) => { e.preventDefault(); stopTalk(); };

refreshStatus().catch(() => { statusEl.textContent = "后端没开，先运行 start.ps1"; });
</script>
</body>
</html>
